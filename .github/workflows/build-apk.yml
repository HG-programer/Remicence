name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rem Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bundle Web Assets into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/* android/app/src/main/assets/web/

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Rem Companion APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemCompanion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
