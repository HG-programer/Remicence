<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Project Remniscence - Rem 3D Model Viewer</title>
    <script type="module" src="libs/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #1e293b 0%, #090d16 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f1f5f9;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        #header-card {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #67e8f9;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }
        .stats-badge {
            display: inline-block;
            margin-top: 10px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .controls-bar {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border-radius: 36px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        button.active {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
    <div id="header-card">
        <h1>🌸 Rem - Re:Zero Companion Model</h1>
        <p>T-Pose 3D Neural Surface Reconstruction for Unity AR/VR</p>
        <div class="stats-badge">10,902 Vertices • 21,752 Polygons • Optimized for XR 90 FPS</div>
    </div>

    <model-viewer
        id="mv"
        src="Rem.glb"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        shadow-intensity="1.5"
        shadow-softness="0.75"
        environment-image="neutral"
        exposure="1.15"
        camera-orbit="0deg 85deg 2.6m"
        min-camera-orbit="auto auto 0.5m"
        max-camera-orbit="auto auto 5.0m">
    </model-viewer>

    <div class="controls-bar">
        <button id="btn-rotate" class="active">🔄 Auto-Rotate</button>
        <button id="btn-front">👤 Front View</button>
        <button id="btn-side">📐 Side View</button>
        <button id="btn-reset">🎯 Reset Camera</button>
    </div>

    <script>
        const mv = document.getElementById('mv');
        const btnRotate = document.getElementById('btn-rotate');

        btnRotate.addEventListener('click', () => {
            mv.autoRotate = !mv.autoRotate;
            btnRotate.classList.toggle('active', mv.autoRotate);
        });

        document.getElementById('btn-front').addEventListener('click', () => {
            mv.cameraOrbit = '0deg 90deg 2.4m';
            mv.cameraTarget = '0m 0m 0m';
        });

        document.getElementById('btn-side').addEventListener('click', () => {
            mv.cameraOrbit = '90deg 90deg 2.4m';
            mv.cameraTarget = '0m 0m 0m';
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            mv.cameraOrbit = '0deg 85deg 2.6m';
            mv.cameraTarget = '0m 0m 0m';
        });
    </script>
</body>
</html>
