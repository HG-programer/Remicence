<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="remHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ribbonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app badge -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="256" r="220" stroke="rgba(56, 189, 248, 0.3)" stroke-width="6" fill="none" />

  <!-- Maid White Katyusha Frill Arch -->
  <path d="M 120 230 C 130 110, 382 110, 392 230 C 370 200, 142 200, 120 230 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 140 215 C 160 140, 352 140, 372 215 C 340 185, 172 185, 140 215 Z" fill="#f1f5f9" />

  <!-- Rem Iconic Sky Blue Bangs & Bob Hair Silhouette -->
  <path d="M 145 220 C 145 130, 367 130, 367 220 C 375 280, 370 330, 355 375 C 335 340, 330 290, 330 270 C 290 320, 260 320, 230 260 C 210 320, 180 320, 157 375 C 142 330, 137 280, 145 220 Z" fill="url(#remHair)" filter="url(#glow)" />

  <!-- Katyusha Flower Accent (Pink Hair Ribbon) -->
  <g transform="translate(340, 190) scale(1.1)">
    <circle cx="0" cy="0" r="16" fill="url(#ribbonPink)" />
    <circle cx="-18" cy="-10" r="14" fill="#f472b6" opacity="0.9" />
    <circle cx="18" cy="-10" r="14" fill="#f472b6" opacity="0.9" />
    <circle cx="-14" cy="14" r="13" fill="#ec4899" opacity="0.9" />
    <circle cx="14" cy="14" r="13" fill="#ec4899" opacity="0.9" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- AR Holographic Ring -->
  <circle cx="256" cy="400" r="70" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" fill="none" opacity="0.7" />
  <circle cx="256" cy="400" r="40" stroke="#ec4899" stroke-width="3" fill="none" opacity="0.6" />

  <!-- App Title Text -->
  <text x="256" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc" letter-spacing="2">REMNISCENCE</text>
</svg>
