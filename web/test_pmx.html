<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMD Rem Test</title>
    <style>body { margin: 0; background: #38bdf8; }</style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/mmdparser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MMDLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/animation/CCDIKSolver.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/animation/MMDPhysics.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/animation/MMDAnimationHelper.js"></script>
</head>
<body>
    <div id="status" style="position:absolute;top:10px;left:10px;color:#fff;background:#000;padding:8px;">Loading MMD Rem...</div>
    <script>
        const status = document.getElementById('status');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.4, 3.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xfffaea, 1.0);
        sun.position.set(5, 10, 7);
        scene.add(sun);

        let mesh = null;
        let helper = new THREE.MMDAnimationHelper();

        const loader = new THREE.MMDLoader();
        loader.load('models/rem_rigged/rem_rigged.pmx', (mmd) => {
            mesh = mmd;
            mesh.scale.setScalar(0.095); // MMD units to meters
            scene.add(mesh);
            helper.add(mesh);
            status.innerText = "Loaded PMX successfully! Bones count: " + mesh.skeleton.bones.length;
            console.log("PMX loaded! Bones:", mesh.skeleton.bones.length);
        }, (xhr) => {
            if (xhr.lengthComputable) {
                status.innerText = "Loading: " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
            }
        }, (err) => {
            status.innerText = "Error loading PMX: " + err.message;
            console.error("PMX load error:", err);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (mesh) {
                mesh.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
