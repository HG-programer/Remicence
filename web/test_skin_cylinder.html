<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body style="margin:0; background:#222;">
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(5, 10, 5);
        scene.add(dir);

        // Cylinder: height 6, 8 height segments
        const geo = new THREE.CylinderGeometry(0.5, 0.5, 6, 16, 8);
        const pos = geo.attributes.position;
        const skinIndices = [];
        const skinWeights = [];

        for (let i = 0; i < pos.count; i++) {
            const y = pos.getY(i); // -3 to +3
            // Bone 0: lower (y < 0), Bone 1: upper (y >= 0)
            if (y < 0) {
                skinIndices.push(0, 1, 0, 0);
                skinWeights.push(1.0, 0.0, 0, 0);
            } else {
                skinIndices.push(1, 0, 0, 0);
                skinWeights.push(1.0, 0.0, 0, 0);
            }
        }
        geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
        geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

        const bone0 = new THREE.Bone();
        bone0.position.set(0, -3, 0);
        const bone1 = new THREE.Bone();
        bone1.position.set(0, 3, 0);
        bone0.add(bone1);

        const skeleton = new THREE.Skeleton([bone0, bone1]);

        const mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, skinning: true });
        const mesh = new THREE.SkinnedMesh(geo, mat);

        mesh.add(bone0);
        mesh.bind(skeleton);
        scene.add(mesh);

        // Bend upper bone by 60 degrees!
        bone1.rotation.z = Math.PI / 3;

        renderer.render(scene, camera);
        console.log("CYLINDER RENDERED OK");
    </script>
</body>
</html>
